version: '3.8'

volumes:
  db-data:

services:
  db:
    image: postgres
    environment:
      - POSTGRES_DB=rts_database
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"

#  client_handler:
#    image: client_handler
#    depends_on:
#      - db
#    ports:
#      - "4999:4999"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - db-data:/var/lib/postgresql/data
