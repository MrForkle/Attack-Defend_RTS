version: '3.8'

volumes:
  db-data:

services:
  db:
    image: postgres
    environment:
      - POSTGRES_DB=rts_database
      - POSTGRES_PASSWORD=password
    ports:
      - 5432:5432

  init:
    image: init
    depends_on:
      - db

  client_handler:
    image: client_handler
    depends_on:
      - db
      - init
    ports:
      - "4999:4999"

  chat_server_main:
    image: chat_server
    environment:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
      - init
    ports:
      - "5001:5001"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: 'admin@pgadmin.com'
      PGADMIN_DEFAULT_PASSWORD: 'password'
    ports:
      - 5050:80
    depends_on:
      - db
    volumes:
      - db-data:/var/lib/postgresql/data
